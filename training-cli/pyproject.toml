[project]
name = "training-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "scikit-surprise>=1.1.5",
    "tqdm>=4.70.1",
    "typer>=0.27.3",
]

[project.scripts]
openrec = "openrec_cli_package.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openrec_cli_package"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
